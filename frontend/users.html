<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f14" />
  <title>用户管理 · 沉浸对话</title>
  <link rel="stylesheet" href="style.css?v=7" />
  <style>
    .admin-wrap { display: flex; height: 100vh; }
    .admin-sidebar {
      width: 260px; flex-shrink: 0; background: var(--bg-soft); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px; gap: 12px;
    }
    .admin-sidebar .brand { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
    .admin-sidebar .sub { font-size: 12px; color: var(--text-dim); margin-top: -8px; }
    .admin-sidebar .back {
      margin-top: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 10px; border-radius: 11px; font-size: 13px; font-weight: 600; text-decoration: none; text-align: center;
    }
    .admin-sidebar .back:hover { background: var(--surface-2); }
    .admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .admin-head {
      padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--bg-soft);
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-head h1 { font-size: 16px; margin: 0; }
    .admin-body { flex: 1; overflow-y: auto; padding: 22px; }

    .user-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    .user-table th, .user-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .user-table th { background: var(--surface-2); color: var(--text-dim); font-weight: 600; }
    .user-table tr:hover td { background: rgba(255,255,255,0.03); }
    .user-table tr.active td { background: rgba(139,124,246,0.12); }
    .user-table .stats { display: flex; gap: 12px; color: var(--text-dim); font-size: 12px; }
    .user-table .tag {
      font-size: 10px; color: var(--accent); border: 1px solid var(--accent);
      border-radius: 4px; padding: 0 5px; margin-left: 6px;
    }
    .user-table .acts { display: flex; gap: 6px; }
    .user-table button { font-size: 12px; padding: 5px 10px; border-radius: 8px; border: none; }
    .user-table .btn-view { background: var(--accent); color: #fff; }
    .user-table .btn-edit { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    .detail-panel {
      margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .detail-tabs { display: flex; gap: 8px; margin: 16px 0 12px; }
    .detail-tab {
      padding: 8px 14px; border-radius: 10px; background: var(--bg-soft); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 13px; cursor: pointer;
    }
    .detail-tab.active { color: var(--text); border-color: var(--accent); background: var(--surface-2); }

    .activity-list, .entity-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .activity-item {
      font-size: 12.5px; padding: 10px 12px; background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 10px; display: flex; gap: 10px;
    }
    .activity-item .time { color: var(--text-dim); white-space: nowrap; }
    .activity-item .act { color: var(--accent); font-weight: 600; min-width: 90px; }
    .activity-item .detail { flex: 1; color: var(--text); }
    .entity-item {
      padding: 10px 12px; background: var(--bg-soft); border: 1px solid var(--border);
      border-radius: 10px; font-size: 13px;
    }
    .entity-item .title { font-weight: 600; }
    .entity-item .meta { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; }
    .muted { color: var(--text-dim); font-size: 13px; padding: 8px 0; }

    .edit-user-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
    .edit-user-form .field { margin: 0; }

    @media (max-width: 720px) {
      .admin-sidebar { width: 100%; position: fixed; bottom: 0; left: 0; height: auto; flex-direction: row; z-index: 40; border-top: 1px solid var(--border); border-right: none; }
      .admin-sidebar .brand, .admin-sidebar .sub { display: none; }
      .admin-sidebar .back { margin-top: 0; }
      .admin-main { padding-bottom: 60px; }
      .user-table { font-size: 12px; }
      .user-table .stats { flex-direction: column; gap: 2px; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">沉浸对话</div>
      <div class="login-sub">管理员登录</div>
      <label class="field"><span>用户名</span><input id="login-user" value="admin" /></label>
      <label class="field"><span>密码</span><input id="login-pass" type="password" /></label>
      <button class="btn primary login-btn" id="btn-login">登 录</button>
      <div class="login-hint" id="login-hint"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="admin-wrap">
      <aside class="admin-sidebar">
        <div class="brand">沉浸对话</div>
        <div class="sub">后台用户管理</div>
        <a class="back" href="/">← 返回聊天</a>
      </aside>
      <main class="admin-main">
        <div class="admin-head">
          <h1>👤 用户管理</h1>
          <div style="font-size:13px;color:var(--text-dim)">管理员：<span id="admin-name"></span></div>
        </div>
        <div class="admin-body">
          <table class="user-table">
            <thead><tr>
              <th>用户名</th><th>角色</th><th>数据概览</th><th>创建时间</th><th>操作</th>
            </tr></thead>
            <tbody id="user-table-body"></tbody>
          </table>
          <div id="detail-root"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script>
'use strict';
const API = '';
const TOKEN_KEY = 'chat_token';
function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
function setToken(t){ t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY); }
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hidden'),2600);
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(method,path,body){
  const opt={method,headers:{}}; const t=getToken(); if(t) opt.headers.Authorization='Bearer '+t;
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r=await fetch(API+path,opt);
  if(r.status===401){ setToken(''); showLogin(); throw new Error('登录已失效'); }
  if(!r.ok){ let msg=`请求失败 (${r.status})`; try{ msg=(await r.json()).detail||msg;}catch(e){} throw new Error(msg); }
  const ct=r.headers.get('content-type')||''; return ct.includes('application/json')?r.json():r;
}

function showLogin(){ $('#login-screen').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#login-hint').textContent=''; $('#login-pass').focus(); }
function hideLogin(){ $('#login-screen').classList.add('hidden'); $('#app').classList.remove('hidden'); }

async function doLogin(){
  const u=$('#login-user').value.trim(), p=$('#login-pass').value;
  if(!u||!p){ $('#login-hint').textContent='请输入用户名和密码'; return; }
  try{
    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if(!r.ok){ $('#login-hint').textContent='用户名或密码错误'; return; }
    const d=await r.json(); setToken(d.token);
    const me=await api('GET','/api/me');
    if(!me.is_admin){ $('#login-hint').textContent='仅管理员可访问此页面'; setToken(''); return; }
    hideLogin(); $('#admin-name').textContent=me.username; loadUsers();
  }catch(e){ $('#login-hint').textContent='登录失败：'+e.message; }
}
$('#btn-login').addEventListener('click',doLogin);
$('#login-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

let users=[], selectedUser=null;

async function loadUsers(){
  try{
    users=await api('GET','/api/users');
    renderTable();
  }catch(e){ toast('加载用户失败：'+e.message); }
}

function renderTable(){
  const tb=$('#user-table-body'); tb.innerHTML='';
  if(!users.length){ tb.innerHTML='<tr><td colspan="5" class="muted">暂无用户</td></tr>'; return; }
  users.forEach(u=>{
    const tr=document.createElement('tr');
    tr.setAttribute('data-uid',u.id);
    tr.innerHTML=`<td><b>${escapeHTML(u.username)}</b>${u.role==='admin'?'<span class="tag">管理员</span>':''}</td>
      <td>${u.role||'user'}</td>
      <td><div class="stats" id="stats-${u.id}">加载中…</div></td>
      <td style="color:var(--text-dim);font-size:12px">${u.created_at ? new Date(u.created_at).toLocaleString() : '-'}</td>
      <td><div class="acts"><button class="btn-view" data-act="view">查看</button><button class="btn-edit" data-act="edit">编辑</button></div></td>`;
    tr.addEventListener('click',e=>{
      const act=e.target.getAttribute('data-act');
      if(act==='view'||act==='edit') selectUser(u.id, act==='edit');
    });
    tb.appendChild(tr);
    loadStats(u.id);
  });
}

async function loadStats(uid){
  try{
    const u=users.find(x=>x.id===uid); if(!u) return;
    const stats=await api('GET','/api/users/'+uid); // returns user with stats
    const box=$(`#stats-${uid}`); if(!box) return;
    const s=stats.stats||{};
    box.innerHTML=`<span>角色 ${s.characters||0}</span><span>会话 ${s.conversations||0}</span><span>消息 ${s.messages||0}</span><span>记忆 ${s.memories||0}</span>`;
  }catch(e){}
}

async function selectUser(uid, editMode=false){
  selectedUser=uid;
  $$('.user-table tr').forEach(tr=>tr.classList.remove('active'));
  const row=$(`.user-table tr[data-uid="${uid}"]`); if(row) row.classList.add('active');
  const root=$('#detail-root'); root.innerHTML='<div class="detail-panel muted">加载中…</div>';
  try{
    const data=await api('GET','/api/users/'+uid+'/activity');
    renderDetail(data, editMode);
  }catch(e){ root.innerHTML='<div class="detail-panel muted">加载失败：'+escapeHTML(e.message)+'</div>'; }
}

function renderDetail(data, editMode){
  const u=data.user, s=data.stats||{}, act=data.activity||[];
  const root=$('#detail-root');
  root.innerHTML=`<div class="detail-panel">
    <h3 style="margin:0 0 14px">${escapeHTML(u.username)} ${u.role==='admin'?'<span class="tag">管理员</span>':''}</h3>
    <div class="detail-grid">
      <div class="entity-item"><div class="title">${s.characters||0}</div><div class="meta">创建角色</div></div>
      <div class="entity-item"><div class="title">${s.conversations||0}</div><div class="meta">会话</div></div>
      <div class="entity-item"><div class="title">${s.messages||0}</div><div class="meta">发送消息</div></div>
      <div class="entity-item"><div class="title">${s.memories||0}</div><div class="meta">相关记忆</div></div>
    </div>
    <div id="edit-form-root"></div>
    <div class="detail-tabs">
      <div class="detail-tab active" data-tab="activity">操作日志 (${act.length})</div>
      <div class="detail-tab" data-tab="characters">角色</div>
      <div class="detail-tab" data-tab="conversations">会话</div>
    </div>
    <div id="tab-content"></div>
  </div>`;
  if(editMode) renderEditForm(u);
  renderTab('activity', u);
  $$('.detail-tab').forEach(t=>t.addEventListener('click',()=>{
    $$('.detail-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
    renderTab(t.getAttribute('data-tab'), u);
  }));
}

function renderEditForm(u){
  const root=$('#edit-form-root');
  root.innerHTML=`<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px">
    <h4 style="margin:0 0 12px;font-size:14px">编辑用户信息</h4>
    <form class="edit-user-form" id="form-edit-${u.id}">
      <label class="field"><span>用户名</span><input name="username" value="${escapeHTML(u.username)}" /></label>
      <label class="field"><span>角色</span>
        <select name="role"><option value="user" ${u.role==='user'?'selected':''}>user</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select>
      </label>
      <label class="field"><span>新密码（留空则不修改）</span><input name="password" type="password" placeholder="不修改" /></label>
      <button type="submit" class="btn primary small">保存</button>
      ${u.role!=='admin'?`<button type="button" class="btn danger small" id="btn-del-user-${u.id}">删除用户</button>`:''}
    </form>
  </div>`;
  $(`#form-edit-${u.id}`).addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const patch={}; const un=fd.get('username').trim(); if(un&&un!==u.username) patch.username=un;
    const role=fd.get('role'); if(role&&role!==u.role) patch.role=role;
    const pwd=fd.get('password'); if(pwd) patch.password=pwd;
    if(!Object.keys(patch).length){ toast('没有改动'); return; }
    try{
      await api('PUT','/api/users/'+u.id,patch);
      toast('用户信息已更新'); await loadUsers(); await selectUser(u.id,true);
    }catch(err){ toast('更新失败：'+err.message); }
  });
  const delBtn=$(`#btn-del-user-${u.id}`);
  if(delBtn) delBtn.addEventListener('click',async ()=>{
    if(!confirm(`确定删除用户 ${u.username} 吗？其创建的角色、会话等数据不会自动删除，但后续无法以此账户登录。`)) return;
    try{ await api('DELETE','/api/users/'+u.id); toast('用户已删除'); selectedUser=null; await loadUsers(); $('#detail-root').innerHTML=''; }
    catch(err){ toast('删除失败：'+err.message); }
  });
}

async function renderTab(tab, u){
  const box=$('#tab-content'); box.innerHTML='<div class="muted">加载中…</div>';
  if(tab==='activity'){
    const data=await api('GET','/api/users/'+u.id+'/activity');
    const list=data.activity||[];
    if(!list.length){ box.innerHTML='<div class="muted">暂无操作日志</div>'; return; }
    box.innerHTML='<div class="activity-list"></div>';
    const ul=box.querySelector('.activity-list');
    list.forEach(a=>{
      const el=document.createElement('div'); el.className='activity-item';
      el.innerHTML=`<span class="time">${a.created_at?new Date(a.created_at).toLocaleString():'-'}</span><span class="act">${escapeHTML(a.action)}</span><span class="detail">${escapeHTML(a.detail||'')}</span>`;
      ul.appendChild(el);
    });
  }else if(tab==='characters'){
    const chars=await api('GET','/api/users/'+u.id+'/characters');
    if(!chars.length){ box.innerHTML='<div class="muted">该用户尚未创建角色</div>'; return; }
    box.innerHTML='<div class="entity-list"></div>'; const ul=box.querySelector('.entity-list');
    chars.forEach(c=>{
      const el=document.createElement('div'); el.className='entity-item';
      el.innerHTML=`<div class="title">${escapeHTML(c.name)}</div><div class="meta">${escapeHTML((c.persona||'').slice(0,80))}${(c.persona||'').length>80?'...':''}</div>`;
      ul.appendChild(el);
    });
  }else if(tab==='conversations'){
    const convs=await api('GET','/api/users/'+u.id+'/conversations');
    if(!convs.length){ box.innerHTML='<div class="muted">该用户尚未创建会话</div>'; return; }
    box.innerHTML='<div class="entity-list"></div>'; const ul=box.querySelector('.entity-list');
    convs.forEach(v=>{
      const el=document.createElement('div'); el.className='entity-item';
      el.innerHTML=`<div class="title">${escapeHTML(v.title||'新对话')}</div><div class="meta">${v.message_count||0} 条消息 · ${v.created_at?new Date(v.created_at).toLocaleString():'-'}</div>`;
      ul.appendChild(el);
    });
  }
}

async function init(){
  if(!getToken()){ showLogin(); return; }
  try{
    const me=await api('GET','/api/me');
    if(!me.is_admin){ showLogin(); $('#login-hint').textContent='仅管理员可访问此页面'; setToken(''); return; }
    hideLogin(); $('#admin-name').textContent=me.username; await loadUsers();
  }catch(e){ showLogin(); $('#login-hint').textContent='登录已失效，请重新登录'; }
}
init();
  </script>
</body>
</html>
