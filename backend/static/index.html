<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f4f8" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="沉浸对话" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="color-scheme" content="dark light" />
  <title>沉浸对话 · AI 角色聊天</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css?v=25" />
</head>
<body>
  <!-- 登录屏（仅管理员，默认不支持注册；管理员可在设置中添加用户） -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">沉浸对话</div>
      <div class="login-sub">管理员登录</div>
      <label class="field">
        <span>用户名</span>
        <input id="login-user" placeholder="admin" autocomplete="username" />
      </label>
      <label class="field">
        <span>密码</span>
        <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      </label>
      <button class="btn primary login-btn" id="btn-login">登 录</button>
      <div class="login-hint" id="login-hint"></div>
      <div class="login-tip">当前不支持注册</div>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- 移动端侧边栏遮罩（点击关闭侧边栏） -->
    <div id="sidebar-backdrop"></div>
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">沉浸对话</div>
        <div class="head-actions">
          <button class="icon-btn user-btn" id="btn-user" title="当前用户">👤</button>
          <button class="icon-btn" id="btn-theme" title="切换主题">🌗</button>
          <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
        </div>
      </div>
      <button class="new-chat" id="btn-new-chat">＋ 新建对话</button>
      <div class="sidebar-tabs">
        <div class="tab active" data-tab="conv">会话</div>
        <div class="tab" data-tab="char">角色库</div>
      </div>
      <div class="list-wrap">
        <div id="conv-list" class="list conv-list"></div>
        <div id="char-list" class="list char-list hidden"></div>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="chat">
      <div class="chat-head" id="chat-head">
        <button class="icon-btn" id="btn-menu-toggle" title="菜单" aria-label="打开菜单">☰</button>
        <div class="chat-head-info">
          <div class="avatar" id="head-avatar">🤖</div>
          <div>
            <div class="chat-name" id="head-name">未选择角色</div>
            <div class="chat-sub" id="head-sub">从「角色库」选择角色开始对话</div>
          </div>
        </div>
        <div class="chat-head-actions">
          <button class="text-btn" id="btn-edit-char" title="编辑当前角色资料" disabled>✏️ 编辑角色</button>
          <button class="text-btn" id="btn-memory" title="角色记忆">🧠 记忆</button>
          <button class="text-btn" id="btn-bg" title="聊天背景">🎨 背景</button>
          <button class="text-btn" id="btn-portrait" title="生成人物当前状态图">🖼 状态图</button>
          <button class="text-btn" id="btn-clear" title="清空上下文">🧹 清空</button>
          <button class="text-btn danger" id="btn-del-conv" title="删除会话">🗑 删除</button>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-hint" id="empty-hint">
          <div class="big-emoji">💬</div>
          <p>选择一个角色，开始沉浸式对话</p>
          <p class="sub">支持日常 · 恋爱 · 脑洞剧情，AI 会记住你们的故事</p>
          <div class="quick-chips">
            <button class="quick-chip" data-prompt="你好呀，今天怎么样？">👋 打个招呼</button>
            <button class="quick-chip" data-prompt="跟我说说你自己吧？">📖 自我介绍</button>
            <button class="quick-chip" data-prompt="给我讲个小故事吧">✨ 讲个故事</button>
            <button class="quick-chip" data-prompt="今天心情有点低落…">💭 陪我聊聊</button>
          </div>
        </div>
        <button class="scroll-bottom hidden" id="btn-scroll-bottom" title="回到最新" aria-label="回到最新">↓</button>
      </div>

      <div class="composer">
        <button class="icon-btn composer-extra" id="btn-emoji" title="表情" aria-label="插入表情">😊</button>
        <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
        <button class="icon-btn composer-extra" id="btn-mic" title="语音输入" aria-label="语音输入">🎤</button>
        <button class="send-btn" id="btn-send">发送</button>
      </div>
      <div class="emoji-panel hidden" id="emoji-panel" role="listbox" aria-label="表情"></div>
      <div class="typing-hint" id="typing-hint"></div>
    </main>
  </div>

  <!-- 通用遮罩 + 弹窗 -->
  <div class="overlay hidden" id="overlay"></div>

  <!-- 设置面板 -->
  <div class="modal hidden" id="settings-modal">
    <div class="modal-head"><span>⚙️ 设置</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">

      <!-- 用户列表 / 密码重置入口（不再管 API Key） -->
      <div class="settings-banner" id="key-banner">
        <span class="b-ico">👥</span>
        <span class="b-text" id="key-banner-text">每位用户的 API Key 独立，由管理员在「用户管理」分配 / 修改：</span>
        <a href="users.html" class="btn primary small settings-banner-cta" id="link-user-admin">前往用户管理 →</a>
      </div>

      <!-- 对话模型 -->
      <section class="settings-card">
        <div class="settings-card-head">
          <div class="sc-title"><span class="sc-ico">💬</span> 对话模型</div>
          <button class="btn ghost small" id="btn-test-chat">测试连接</button>
        </div>
        <div class="settings-card-body">
          <label class="field">
            <span>API 地址（OpenAI 兼容）</span>
            <input id="cfg-api_base" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
            <small>默认 DashScope 灵积 OpenAI 兼容接口；本地 Ollama 可填 http://localhost:11434/v1</small>
          </label>
          <label class="field">
            <span>API Key</span>
            <div class="input-with-toggle">
              <input id="cfg-api_key" type="password" placeholder="你的 API Key（每位用户独立）" autocomplete="off" />
              <button type="button" class="key-toggle" data-target="cfg-api_key" title="明文查看 / 隐藏">👁</button>
            </div>
            <small class="cfg-key-source" id="cfg-api_key-source"></small>
          </label>
          <label class="field">
            <span>模型名称</span>
            <input id="cfg-model" placeholder="qwen-turbo / qwen-plus / qwen-max 等" />
          </label>
          <div class="row">
            <label class="field">
              <span>温度 <b id="val-temp">0.9</b></span>
              <input type="range" id="cfg-temperature" min="0" max="2" step="0.1" />
            </label>
            <label class="field">
              <span>回复长度 <b id="val-tokens">512</b></span>
              <input type="range" id="cfg-max_tokens" min="64" max="2048" step="64" />
            </label>
          </div>
          <label class="field">
            <span>上下文记忆轮数 <b id="val-rounds">30</b></span>
            <input type="range" id="cfg-context_rounds" min="4" max="80" step="2" />
            <small>AI 会记住最近这么多轮对话的人物关系与剧情</small>
          </label>
          <label class="field">
            <span>全局附加提示（可选）</span>
            <textarea id="cfg-system_note" rows="2" placeholder="例如：整体语气更温柔一些"></textarea>
          </label>
        </div>
      </section>

      <!-- 图像生成 -->
      <section class="settings-card">
        <div class="settings-card-head">
          <div class="sc-title"><span class="sc-ico">🖼</span> 人物状态图生成（可选）</div>
          <button class="btn ghost small" id="btn-test-image">测试图像</button>
        </div>
        <div class="settings-card-body">
          <label class="field">
            <span>图像生成 API 地址</span>
            <input id="cfg-image_api_base" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
            <small>支持 OpenAI 兼容接口；阿里云百炼地址会自动识别 wanx-v1 / qwen-image-* 等模型并走对应原生异步接口</small>
          </label>
          <label class="field">
            <span>图像 API Key（留空则复用上方对话 API Key）</span>
            <div class="input-with-toggle">
              <input id="cfg-image_api_key" type="password" placeholder="留空 = 用对话 API Key（每位用户独立）" autocomplete="off" />
              <button type="button" class="key-toggle" data-target="cfg-image_api_key" title="明文查看 / 隐藏">👁</button>
            </div>
          </label>
          <div class="row">
            <label class="field">
              <span>图像模型名</span>
              <input id="cfg-image_model" placeholder="qwen-image-3.0" />
            </label>
            <label class="field">
              <span>图像尺寸</span>
              <input id="cfg-image_size" placeholder="1024x1024" />
            </label>
          </div>
        </div>
      </section>

      <!-- 账户 -->
      <section class="settings-card">
        <div class="settings-card-head">
          <div class="sc-title"><span class="sc-ico">🔒</span> 账户</div>
        </div>
        <div class="settings-card-body">
          <div class="row password-row">
            <label class="field">
              <span>旧密码</span>
              <input id="pwd-old" type="password" placeholder="原密码（管理员可留空）" />
            </label>
            <label class="field">
              <span>新密码</span>
              <input id="pwd-new" type="password" placeholder="至少 4 位" />
            </label>
            <button class="btn primary small" id="btn-change-pwd">修改密码</button>
          </div>
        </div>
      </section>

      <div class="modal-foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn ghost" id="btn-logout">退出登录</button>
        <button class="btn primary" id="btn-save-config">保存</button>
      </div>
    </div>
  </div>

  <!-- 聊天背景 -->
  <div class="modal hidden" id="bg-modal">
    <div class="modal-head"><span>🎨 聊天背景</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p class="mem-tip">为当前会话设置专属聊天背景，可选预设或上传图片。</p>
      <div class="bg-presets" id="bg-presets"></div>
      <div class="row" style="align-items:center;">
        <button class="btn ghost small" id="bg-upload-btn">上传图片背景</button>
        <input type="file" id="bg-upload-file" accept="image/*" class="hidden" />
        <button class="btn ghost small" id="bg-clear-btn">清除背景</button>
      </div>
      <div class="modal-foot">
        <button class="btn primary" id="btn-save-bg">应用背景</button>
      </div>
    </div>
  </div>

  <!-- 人物当前状态图 -->
  <div class="modal hidden" id="portrait-modal">
    <div class="modal-head"><span>🖼 人物当前状态</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="portrait-box" id="portrait-box">
        <div class="portrait-placeholder">点击「生成」根据最近聊天描绘 TA 此刻的样子</div>
      </div>
      <div class="portrait-desc" id="portrait-desc"></div>
      <div class="modal-foot">
        <button class="btn primary" id="btn-gen-portrait">生成</button>
      </div>
    </div>
  </div>

  <!-- 角色库 -->
  <div class="modal hidden" id="chars-modal">
    <div class="modal-head"><span>🎭 角色库</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="char-toolbar">
        <button class="btn primary" id="btn-new-char">＋ 新建角色</button>
        <button class="btn ghost" id="btn-import-char">导入角色卡</button>
        <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
      </div>
      <div class="char-grid" id="char-grid"></div>
    </div>
  </div>

  <!-- 角色编辑 -->
  <div class="modal hidden" id="char-edit-modal">
    <div class="modal-head"><span id="char-edit-title">编辑角色</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="row">
        <label class="field">
          <span>角色名</span>
          <input id="ce-name" placeholder="角色名字" />
        </label>
        <label class="field avatar-field">
          <span>头像（表情或图片）</span>
          <div class="avatar-row">
            <div class="avatar preview" id="ce-avatar-preview">🙂</div>
            <input id="ce-avatar" placeholder="输入 emoji，如 🐱" />
            <button class="btn ghost small" id="ce-upload">上传图片</button>
            <input type="file" id="ce-upload-file" accept="image/*" class="hidden" />
          </div>
        </label>
      </div>
      <label class="field">
        <span>人物背景 / 设定</span>
        <textarea id="ce-persona" rows="3" placeholder="TA 是谁，来自哪里，经历了什么…"></textarea>
      </label>
      <div class="row">
        <label class="field">
          <span>性格</span>
          <textarea id="ce-personality" rows="3" placeholder="傲娇、温柔、毒舌…"></textarea>
        </label>
        <label class="field">
          <span>说话风格</span>
          <textarea id="ce-speaking_style" rows="3" placeholder="口语化？书面？爱用语气词？"></textarea>
        </label>
      </div>
      <label class="field">
        <span>世界观 / 长篇设定（可选）</span>
        <textarea id="ce-world_setting" rows="3" placeholder="故事背景、世界规则等长文本"></textarea>
      </label>
      <label class="field">
        <span>示例对话（可选）</span>
        <textarea id="ce-example_dialogues" rows="3" placeholder="用户：……\n角色：……"></textarea>
      </label>
      <label class="field">
        <span>开场白（可选）</span>
        <textarea id="ce-greeting" rows="2" placeholder="新建对话时 TA 说的第一句话"></textarea>
      </label>
      <label class="field">
        <span>参考图（可选，用于保证出图与角色一致）</span>
        <div class="refs-wrap">
          <div class="refs-grid" id="ce-refs"></div>
          <button class="btn ghost small" id="ce-refs-upload" type="button">＋ 添加参考图</button>
          <input type="file" id="ce-refs-file" accept="image/*" multiple class="hidden" />
        </div>
        <small>可上传多张（角色头像 / 设定图 / 风格参考）。生图时会连同头像一起作为参考。</small>
      </label>
      <label class="field">
        <span>标签（可选，逗号分隔）</span>
        <input id="ce-tags" placeholder="猫娘, 恋愛, 校园" />
      </label>
      <div class="modal-foot">
        <button class="btn danger hidden" id="btn-del-char">🗑 删除此角色</button>
        <button class="btn ghost" id="btn-export-char">导出角色卡</button>
        <button class="btn primary" id="btn-save-char">保存</button>
      </div>
    </div>
  </div>

  <!-- 记忆面板 -->
  <div class="modal hidden" id="memory-modal">
    <div class="modal-head"><span>🧠 角色记忆</span><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p class="mem-tip">AI 在生成回复时会读取这些记忆要点，复刻猫箱式记忆机制。</p>
      <div class="mem-add">
        <textarea id="mem-input" rows="2" placeholder="手动添加一条记忆要点，例如：用户叫小明，是 TA 的青梅竹马"></textarea>
        <button class="btn primary small" id="btn-add-mem">添加</button>
      </div>
      <div class="mem-auto">
        <button class="btn ghost small" id="btn-auto-mem">✨ 从最近对话自动总结为记忆</button>
      </div>
      <div class="mem-list" id="mem-list"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/shared.js?v=25"></script>
  <script src="/js/app.js?v=25"></script>
</body>
</html>
